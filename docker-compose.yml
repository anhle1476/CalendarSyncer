version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: calendar-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"     # AMQP port
      - "15672:15672"   # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - calendar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  webhook-service:
    build:
      context: ./webhook-service
      dockerfile: Dockerfile
    container_name: calendar-webhook
    ports:
      - "3000:3000"     # HTTP port
      - "3443:3443"     # HTTPS port (for production)
    environment:
      NODE_ENV: development
      PORT: 3000
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
      RABBITMQ_QUEUE: calendar_events
      WEBHOOK_PATH: /webhook/calendar
    volumes:
      - ./webhook-service:/app
      - /app/node_modules
      - ./certs:/certs:ro
    networks:
      - calendar-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  calendar-network:
    driver: bridge

volumes:
  rabbitmq_data:
    driver: local